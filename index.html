<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEP-漢 프로젝트 수업 점수판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🐉 DEEP-漢 프로젝트 수업 점수판</h1>
            <p class="subtitle">퀴즈를 맞추거나 좋은 질문을 한 모둠에게 점수를! (총 4차시)</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="changePeriod('total')">누적 점수</button>
            <button class="tab-btn" onclick="changePeriod(1)">1차시</button>
            <button class="tab-btn" onclick="changePeriod(2)">2차시</button>
            <button class="tab-btn" onclick="changePeriod(3)">3차시</button>
            <button class="tab-btn" onclick="changePeriod(4)">4차시</button>
        </div>

        <div class="view-indicator">
            현재 보기: <span id="current-view">누적 점수</span>
        </div>

        <div class="scoreboard" id="scoreboard">
            <div class="team-card">
                <div class="team-name">1모둠</div>
                <div class="score-display" id="score-team-0">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-0" onclick="updateScore(0, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-0" onclick="updateScore(0, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">2모둠</div>
                <div class="score-display" id="score-team-1">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-1" onclick="updateScore(1, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-1" onclick="updateScore(1, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">3모둠</div>
                <div class="score-display" id="score-team-2">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-2" onclick="updateScore(2, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-2" onclick="updateScore(2, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">4모둠</div>
                <div class="score-display" id="score-team-3">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-3" onclick="updateScore(3, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-3" onclick="updateScore(3, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">5모둠</div>
                <div class="score-display" id="score-team-4">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-4" onclick="updateScore(4, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-4" onclick="updateScore(4, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">6모둠</div>
                <div class="score-display" id="score-team-5">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-5" onclick="updateScore(5, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-5" onclick="updateScore(5, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">7모둠</div>
                <div class="score-display" id="score-team-6">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-6" onclick="updateScore(6, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-6" onclick="updateScore(6, 1)" disabled>+</button>
                </div>
            </div>
            <div class="team-card">
                <div class="team-name">8모둠</div>
                <div class="score-display" id="score-team-7">0점</div>
                <div class="control-btns">
                    <button class="btn btn-minus" id="minus-7" onclick="updateScore(7, -1)" disabled>-</button>
                    <button class="btn btn-plus" id="plus-7" onclick="updateScore(7, 1)" disabled>+</button>
                </div>
            </div>
        </div>

        <footer>
            <button class="reset-btn" onclick="resetScores()">점수 초기화</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
